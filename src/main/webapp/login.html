<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Student Portal Login - Sign into your university account">
  <title>Student Login | University Portal</title>

  <!-- Bootstrap 5 CSS CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <!-- Bootstrap Icons CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

  <!-- Custom Design System CSS -->
  <link href="css/style.css" rel="stylesheet">
</head>
<body>

  <!-- Ambient Light Effects -->
  <div class="bg-ambient-wrapper">
    <div class="ambient-orb-1"></div>
    <div class="ambient-orb-2"></div>
  </div>

  <div class="page-wrapper">
    <div class="auth-card">
      
      <!-- Brand & Header -->
      <div class="auth-header">
        <div class="brand-badge">
          <i class="bi bi-mortarboard-fill"></i>
        </div>
        <h1>Welcome Back</h1>
        <p>Sign in to your student dashboard</p>
      </div>

      <!-- Server / System Alerts Container -->
      <div id="serverAlertContainer"></div>

      <!-- Login Form (PDF Step 3 & Step 6) -->
      <form id="loginForm" action="LoginServlet" method="POST" novalidate>
        
        <!-- Email Field -->
        <div class="form-group-custom">
          <label for="email" class="form-label-custom">Student Email</label>
          <div class="input-container">
            <i class="bi bi-envelope input-icon-left"></i>
            <input 
              type="email" 
              class="form-control-custom" 
              id="email" 
              name="email" 
              placeholder="e.g. student@university.edu"
              autocomplete="email"
              required>
          </div>
          <div id="emailError" class="error-feedback"></div>
        </div>

        <!-- Password Field -->
        <div class="form-group-custom">
          <div class="d-flex justify-content-between align-items-center">
            <label for="password" class="form-label-custom">Password</label>
          </div>
          <div class="input-container">
            <i class="bi bi-lock input-icon-left"></i>
            <input 
              type="password" 
              class="form-control-custom" 
              id="password" 
              name="password" 
              placeholder="Enter your password"
              autocomplete="current-password"
              required>
            <button type="button" class="btn-toggle-password" data-target="password" title="Show/Hide Password" aria-label="Toggle password visibility">
              <i class="bi bi-eye"></i>
            </button>
          </div>
          <div id="passwordError" class="error-feedback"></div>
        </div>

        <!-- Submit Button -->
        <div class="mt-4">
          <button type="submit" id="loginBtn" class="btn-submit-custom">
            <span>Sign In</span>
            <i class="bi bi-box-arrow-in-right"></i>
          </button>
        </div>

      </form>

      <!-- Footer Link to Register -->
      <div class="auth-footer">
        Don't have an account yet? <a href="register.html" id="goToRegisterLink">Create one here</a>
      </div>

    </div>
  </div>

  <!-- Bootstrap 5 Bundle JS CDN -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Step 4: Client-Side Validation JavaScript -->
  <script src="js/script.js"></script>

</body>
</html>
